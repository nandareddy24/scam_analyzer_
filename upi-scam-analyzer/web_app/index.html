<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UPI Scam Analyzer | Financial Fraud & Threat Detection</title>
    
    <!-- Meta & SEO -->
    <meta name="description" content="Verify suspicious UPI IDs, phishing URLs, fraudulent SMS messages, and QR codes before sending money. Built with NPCI safety advisories and National Cyber Crime 1930 integration." />
    <meta name="keywords" content="UPI fraud detection, scam analyzer, phishing checker, cyber crime helpline 1930, VPA lookup, financial security" />
    <meta name="author" content="UPI Scam Analyzer Team" />
    <meta name="theme-color" content="#0f172a" />

    <!-- Open Graph -->
    <meta property="og:title" content="UPI Scam Analyzer | Financial Fraud & Threat Detection" />
    <meta property="og:description" content="Verify suspicious UPI IDs, phishing URLs, fraudulent SMS messages, and QR codes before sending money." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/favicon.svg" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Plus Jakarta Sans', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            animation: {
              fadeIn: 'fadeIn 0.4s ease-out forwards',
              pulseGlow: 'pulseGlow 2s infinite',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0', transform: 'translateY(6px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              pulseGlow: {
                '0%, 100%': { opacity: '0.6' },
                '50%': { opacity: '1' },
              }
            }
          }
        }
      }
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased font-['Plus_Jakarta_Sans',sans-serif] selection:bg-blue-600/30 selection:text-blue-200 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
